<script>
document.addEventListener('DOMContentLoaded', function () {
  var menu = document.getElementById('menu');
  if (!menu) return;

  var li = document.createElement('li');
  li.innerHTML =
    '<form action="/photo-gallery/search/" method="get" ' +
    'style="display:flex;align-items:center;margin:0;">' +
    '<input type="search" name="q" placeholder="Search…" ' +
    'style="background:transparent;border:none;border-bottom:1px solid #666;' +
    'color:inherit;font-size:0.85rem;width:90px;padding:2px 6px;outline:none;' +
    'transition:width 0.3s ease;" ' +
    'onfocus="this.style.width=\'160px\'" ' +
    'onblur="this.style.width=\'90px\'" />' +
    '</form>';
  menu.appendChild(li);
});
</script>
