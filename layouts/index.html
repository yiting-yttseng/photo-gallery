{{- define "main" }}
<div class="timeline-page">
  <h1 class="timeline-title">Home</h1>
  <p class="timeline-subtitle">A collection of moments and places.</p>

  <h2 class="section-heading">Timeline</h2>
  <div class="timeline">
    {{- range (where .Site.RegularPages "Section" "albums") }}
    <a href="{{ .Permalink }}" class="timeline-item">
      <span class="timeline-date">{{ .Date.Format "Jan 2006" }}</span>
      <span class="timeline-name">{{ .Title }}</span>
    </a>
    {{- end }}
  </div>
</div>
{{- end }}
